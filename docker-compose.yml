services:
  mission-control:
    build: .
    container_name: mission-control
    ports:
      - '4000:4000'
    volumes:
      # DB + credential encryption key survive container rebuilds
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/mission-control.db
      # Recommended: require a bearer token for external API calls
      # - MC_API_TOKEN=change-me
      # Optional: fixed credential encryption key (64 hex chars) instead of
      # the auto-generated /data/.arb-secret
      # - ARB_ENCRYPTION_KEY=
    restart: unless-stopped
